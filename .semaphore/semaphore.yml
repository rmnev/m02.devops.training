version: v1.0
name: "\U0001F3AF Simple CI Pipeline"
agent:
  machine:
    type: f1-standard-4
    os_image: ubuntu2404
fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'
global_job_config:
  prologue:
    commands:
      - checkout
blocks:
  - name: Install dependencies
    dependencies: []
    task:
      jobs:
        - name: 'Job #1'
          commands:
            - sudo apt-get update
            - sudo apt install -y python3.12-venv
            - python -m venv venv
            - source venv/bin/activate
            - pip install pytest requests flask coverage locust
  - name: TDD
    dependencies:
      - Install dependencies
    task:
      jobs:
        - name: test
          commands:
            - sudo apt install -y python3-pytest
            - 'export PATH=$PATH:/home/semaphore/.local/bin'
            - checkout
            - cd 1-tdd
            - pytest
  - name: Unit
    dependencies:
      - Install dependencies
    task:
      jobs:
        - name: test
          commands:
            - sudo apt install -y python3-pytest
            - 'export PATH=$PATH:/home/semaphore/.local/bin'
            - checkout
            - cd 2-unit-testing
            - pytest
  - name: Integration tests
    dependencies:
      - Install dependencies
    task:
      jobs:
        - name: test
          commands:
            - sudo apt install -y python3-pytest
            - 'export PATH=$PATH:/home/semaphore/.local/bin'
            - checkout
            - cd 3-integration-testing
            - pytest
  - name: E2E
    dependencies:
      - Install dependencies
    task:
      jobs:
        - name: test
          commands:
            - sudo apt-get update
            - sudo apt install -y python3.12-venv
            - python -m venv venv
            - source venv/bin/activate
            - sudo apt install -y python3-pytest
            - 'export PATH=$PATH:/home/semaphore/.local/bin'
            - checkout
            - cd 4-e2e
            - pip install -r requirements.txt
            - python app.py &
            - pytest
  - name: Reporting
    dependencies:
      - Coverage
    task:
      jobs:
        - name: Test reports
          commands:
            - sudo apt-get update
            - sudo apt install -y python3.12-venv
            - python -m venv venv
            - source venv/bin/activate
            - sudo apt install -y python3-pytest
            - 'export PATH=$PATH:/home/semaphore/.local/bin'
            - checkout
            - cd 5-test-reports
            - pytest --junitxml=reports.xml; echo $? > pytest_exit_code
            - test-results publish --name "Test Reports" reports.xml
            - artifact push workflow reports.xml
            - exit $(cat pytest_exit_code)
  - name: Coverage
    dependencies:
      - E2E
      - Integration tests
      - TDD
      - Unit
    task:
      jobs:
        - name: Collect
          commands:
            - pip install coverage
            - cd 7-test-coverage
            - coverage run -m pytest
            - coverage report -m
            - coverage html
            - tar -czf coverage-report.tar.gz htmlcov
            - artifact push workflow coverage-report.tar.gz
after_pipeline:
  task:
    jobs:
      - name: Report generation
        commands:
          - test-results gen-pipeline-report

version: v1.0
name: "\U0001F3AF Simple CI Pipeline"
agent:
  machine:
    type: f1-standard-4
    os_image: ubuntu2404
fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'
global_job_config:
  prologue:
    commands:
      - checkout
blocks:
  - name: Install dependencies
    dependencies: []
    task:
      jobs:
        - name: 'Job #1'
          commands:
            - pip install pytest requests flask coverage locust
  - name: Unit Test
    dependencies:
      - Install dependencies
    task:
      jobs:
        - name: test
          commands:
            - checkout
            - 'export PATH=$PATH:/home/semaphore/.local/bin'
            - cd 1-tdd
            - python test_factorial.py
            - echo hello1
